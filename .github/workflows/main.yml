name: Build V Adhyay Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Confirm project location
        run: |
          ls -la
          ls -la v-adhyay-preview
          test -f v-adhyay-preview/package.json

      - name: Install dependencies
        working-directory: v-adhyay-preview
        run: npm install

      - name: Build React app
        working-directory: v-adhyay-preview
        run: npm run build

      - name: Create Android project
        working-directory: v-adhyay-preview
        run: npx cap add android

      - name: Sync Android project
        working-directory: v-adhyay-preview
        run: npx cap sync android

      - name: Build APK
        working-directory: v-adhyay-preview/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Adhyay-Android-APK
          path: v-adhyay-preview/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
