name: Build V Adhyay Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify project
        run: |
          pwd
          ls -la
          ls -la v-adhyay-preview
          test -f v-adhyay-preview/package.json

      - name: Install dependencies
        run: cd v-adhyay-preview && npm install

      - name: Build app
        run: cd v-adhyay-preview && npm run build

      - name: Add Android
        run: cd v-adhyay-preview && npx cap add android

      - name: Sync Android
        run: cd v-adhyay-preview && npx cap sync android

      - name: Compile APK
        run: cd v-adhyay-preview/android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V-Adhyay-Android-APK
          path: v-adhyay-preview/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
